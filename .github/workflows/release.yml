name: Publicar instaladores

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Gerar ícone
        run: node apps/desktop/scripts/create-icon.js

      - name: Compilar .exe
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/release/*.exe

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar ícone
        run: node apps/desktop/scripts/create-icon.js

      - name: Copiar ícone para o Android
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp apps/desktop/assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Compilar APK assinado
        working-directory: android
        run: gradle assembleDebug

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Melhore-1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  publish:
    name: Publicar no GitHub Releases
    needs: [windows, android]
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: Melhore ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            windows-installer/*.exe
            android-apk/*.apk
          body: |
            Primeira versão pública do Melhore.

            - **Windows:** instalador NSIS 64-bit
            - **Android:** APK para instalação direta
