plugins {
    id "com.android.application"
}

android {
    namespace "com.melhore.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.melhore.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {}
